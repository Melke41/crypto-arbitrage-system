[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-arbitrage-system"
version = "0.1.0"
description = "Production-grade, modular event-driven crypto arbitrage intelligence and trading system"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Melke41", email = "melke41@users.noreply.github.com" }
]
dependencies = [
    "pydantic>=2.6.0",
    "ccxt>=4.2.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "prometheus-client>=0.19.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "streamlit>=1.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.31.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
