# Exchange Configuration Matrix: Binance Spot vs. Kraken Spot

binance:
  exchange_id: "BINANCE"
  rest_url: "https://api.binance.com/api/v3"
  testnet_rest_url: "https://testnet.binance.vision/api/v3"
  ws_url: "wss://stream.binance.com:9443/ws"
  testnet_ws_url: "wss://testnet.binance.vision/ws"
  depth_stream_suffix: "@depth@100ms"
  default_maker_fee_bps: 10.0   # 0.10% conservative default
  default_taker_fee_bps: 10.0   # 0.10% conservative default
  enable_bnb_discount: false
  bnb_discount_maker_fee_bps: 7.5
  bnb_discount_taker_fee_bps: 7.5
  min_bnb_balance_for_discount: "0.1"
  rate_limits:
    ip_weight_per_min: 1200
    orders_per_10s: 100
    orders_per_24h: 200000

kraken:
  exchange_id: "KRAKEN"
  rest_url: "https://api.kraken.com/0"
  ws_url: "wss://ws.kraken.com/v2"
  ws_auth_url: "wss://ws-auth.kraken.com/v2"
  default_maker_fee_bps: 25.0   # 0.25% standard tier
  default_taker_fee_bps: 40.0   # 0.40% standard tier
  rate_limits:
    call_counter_max: 20
    decay_rate_per_sec: 0.5
